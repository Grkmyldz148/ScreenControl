name: Release

# Etiket push'uyla değil, elle tetiklenir. Yayın geri alınamayan bir iş;
# yanlışlıkla push'lanmış bir etiketin sürüm çıkarmasını istemiyoruz.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm (x.y.z) — v ön eki olmadan"
        required: true
        type: string

permissions:
  contents: write        # release oluşturmak ve appcast'i main'e push'lamak için

concurrency:
  group: release         # iki yayın aynı anda appcast'e yazmasın
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize and publish
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      # fetch-depth: 0 — release.sh HEAD'in origin'e gönderilmiş olduğunu
      # doğruluyor; sığ klonda o karşılaştırma yapılamaz.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      # Girdi doğrudan script'e gömülmüyor: `${{ }}` shell'e metin olarak
      # yapıştırıldığı için tırnak kaçıran bir sürüm dizgisi komut çalıştırabilir.
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::sürüm x.y.z olmalı: $VERSION"; exit 1; }

      - name: Cache SwiftPM dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      # Sertifika koşuya özel, kilitli bir keychain'e alınıyor ve son adımda
      # siliniyor. Runner'ın login keychain'ine hiçbir şey yazılmıyor.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Bu olmadan codesign her imzada parola sorar ve koşu asılı kalır.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # find-identity arama listesine bakıyor; keychain'i listeye ekliyoruz.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "Bulunan kimlik:"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "ScreenControl" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN"

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ inputs.version }}
        run: ./release.sh "$VERSION"

      # Koşu başarısız olsa da keychain silinmeli: runner geri dönüşümlü değil
      # ama sertifikayı diskte bırakmanın hiçbir gerekçesi yok.
      - name: Remove keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
